let W=960,H=540,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';}
window.addEventListener('resize',resize);resize();

// ---------------- input: keyboard + mouse + gamepad (GameSir/Xbox/PS layout) + touch ----------------
const keys={},pressed={};let anyKey=false,lastKey=null,clickPt=null;
const PREVENT=new Set(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
window.addEventListener('keydown',e=>{if(PREVENT.has(e.code))e.preventDefault();if(e.repeat)return;keys[e.code]=true;pressed[e.code]=true;lastKey=e.code;anyKey=true;initAudio();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});
cv.addEventListener('mousedown',e=>{const k='M'+e.button;keys[k]=true;pressed[k]=true;anyKey=true;if(e.button===0)clickPt={x:e.clientX,y:e.clientY};initAudio();});
window.addEventListener('mouseup',e=>{keys['M'+e.button]=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;for(const k in touchDown)touchDown[k]=false;});
function consume(...codes){let r=false;for(const c of codes){if(pressed[c]){r=true;pressed[c]=false;}}return r;}
function held(...codes){for(const c of codes)if(keys[c])return true;return false;}
function clearPressed(){for(const k in pressed)pressed[k]=false;for(const k in padPressed)padPressed[k]=false;for(const k in touchPressed)touchPressed[k]=false;anyKey=false;clickPt=null;}

// actions & bindings
const ACTIONS=['left','right','attack','deflect','dodge','jump','heal','pause'];
const ACT_LABEL={left:'Move left',right:'Move right',attack:'Attack',deflect:'Deflect / Guard',dodge:'Dodge',jump:'Jump',heal:'Heal',pause:'Pause'};
const DEFAULT_BIND={left:{k:['KeyA','ArrowLeft'],p:[14]},right:{k:['KeyD','ArrowRight'],p:[15]},attack:{k:['KeyJ','KeyZ'],p:[2,5]},deflect:{k:['KeyK','KeyX'],p:[4,6]},dodge:{k:['KeyL','KeyC','ShiftLeft'],p:[1]},jump:{k:['Space','KeyW','ArrowUp'],p:[0]},heal:{k:['KeyH','KeyQ'],p:[3]},pause:{k:['KeyP','Escape'],p:[9]}};
const FIXED={confirm:{k:['Enter','NumpadEnter'],p:[0,9]},back:{k:['Escape','Backspace'],p:[1]},options:{k:['KeyO'],p:[8]},up:{k:['ArrowUp','KeyW'],p:[12]},down:{k:['ArrowDown','KeyS'],p:[13]},mleft:{k:['ArrowLeft','KeyA'],p:[14]},mright:{k:['ArrowRight','KeyD'],p:[15]}};
const PAD_NAMES={0:'A',1:'B',2:'X',3:'Y',4:'L1',5:'R1',6:'L2',7:'R2',8:'Select',9:'Start',10:'L3',11:'R3',12:'D-Up',13:'D-Down',14:'D-Left',15:'D-Right',16:'Home'};
const SETTINGS={bind:JSON.parse(JSON.stringify(DEFAULT_BIND)),touch:'auto'};
function loadSettings(){try{const s=JSON.parse(localStorage.getItem('paperblade.settings')||'null');if(s&&s.bind){for(const a of ACTIONS)if(s.bind[a]&&s.bind[a].k&&s.bind[a].p)SETTINGS.bind[a]=s.bind[a];}if(s&&s.touch)SETTINGS.touch=s.touch;}catch(e){}}
function saveSettings(){try{localStorage.setItem('paperblade.settings',JSON.stringify(SETTINGS));}catch(e){}}
loadSettings();
function keyName(c){if(!c)return '—';if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);if(c.startsWith('Arrow'))return '←↑→↓'['LeftUpRightDown'.indexOf(c.slice(5))/4|0]||c.slice(5);return c.replace('Left','L').replace('Right','R');}

// gamepad polling (navigator.getGamepads + a virtual pad fed by the Android wrapper)
const virtPad={active:false,buttons:new Array(17).fill(false),axes:[0,0]};
window.androidPad=function(btn,down){virtPad.active=true;virtPad.buttons[btn]=!!down;};
window.androidAxis=function(i,v){virtPad.active=true;virtPad.axes[i]=v;};
let padDown=new Array(17).fill(false),padPressed={},padConnected=false,lastPadBtn=null;
function pollInput(){
 let pads=[];try{pads=navigator.getGamepads?Array.from(navigator.getGamepads()):[];}catch(e){}
 const cur=new Array(17).fill(false);let any=false;
 for(const gp of pads){if(!gp)continue;any=true;gp.buttons.forEach((b,i)=>{if(i<17&&(b.pressed||b.value>0.5))cur[i]=true;});const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(ax<-0.5)cur[14]=true;if(ax>0.5)cur[15]=true;if(ay<-0.5)cur[12]=true;if(ay>0.5)cur[13]=true;}
 if(virtPad.active){any=true;virtPad.buttons.forEach((v,i)=>{if(v)cur[i]=true;});if(virtPad.axes[0]<-0.5)cur[14]=true;if(virtPad.axes[0]>0.5)cur[15]=true;if(virtPad.axes[1]<-0.5)cur[12]=true;if(virtPad.axes[1]>0.5)cur[13]=true;}
 for(let i=0;i<17;i++){if(cur[i]&&!padDown[i]){padPressed[i]=true;lastPadBtn=i;anyKey=true;}}
 padDown=cur;padConnected=any;
}
// touch controls
const touchDown={},touchPressed={};const touchBtns=[];const activeTouches={};
function touchEnabled(){if(SETTINGS.touch==='on')return true;if(SETTINGS.touch==='off')return false;return ('ontouchstart' in window)||navigator.maxTouchPoints>0;}
function btnAt(x,y){for(const b of touchBtns){if(Math.hypot(x-b.x,y-b.y)<=b.r+8)return b;}return null;}
cv.addEventListener('touchstart',e=>{e.preventDefault();initAudio();for(const t of Array.from(e.changedTouches)){const b=touchEnabled()?btnAt(t.clientX,t.clientY):null;if(b){activeTouches[t.identifier]=b.a;touchDown[b.a]=true;touchPressed[b.a]=true;}else{clickPt={x:t.clientX,y:t.clientY};}anyKey=true;}},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();for(const t of Array.from(e.changedTouches)){const a=activeTouches[t.identifier];if(!a)continue;const b=btnAt(t.clientX,t.clientY);if(!b||b.a!==a){touchDown[a]=false;delete activeTouches[t.identifier];if(b){activeTouches[t.identifier]=b.a;touchDown[b.a]=true;touchPressed[b.a]=true;}}}},{passive:false});
const touchEnd=e=>{e.preventDefault();for(const t of Array.from(e.changedTouches)){const a=activeTouches[t.identifier];if(a){touchDown[a]=false;delete activeTouches[t.identifier];}}};
cv.addEventListener('touchend',touchEnd,{passive:false});cv.addEventListener('touchcancel',touchEnd,{passive:false});
// action queries
function bindOf(a){return SETTINGS.bind[a]||FIXED[a];}
function down(a){const b=bindOf(a);if(!b)return false;for(const c of b.k)if(keys[c])return true;for(const i of b.p)if(padDown[i])return true;if(touchDown[a])return true;if(a==='attack'&&keys.M0)return true;if(a==='deflect'&&keys.M2)return true;return false;}
function hit(a){const b=bindOf(a);if(!b)return false;let r=false;for(const c of b.k)if(pressed[c]){pressed[c]=false;r=true;}for(const i of b.p)if(padPressed[i]){padPressed[i]=false;r=true;}if(touchPressed[a]){touchPressed[a]=false;r=true;}if(a==='attack'&&pressed.M0){pressed.M0=false;r=true;}if(a==='deflect'&&pressed.M2){pressed.M2=false;r=true;}if(a==='confirm'&&(pressed.M0||touchPressed.confirm)){pressed.M0=false;touchPressed.confirm=false;r=true;}return r;}

// ---------------- audio (tiny synth) ----------------
let AC=null,noiseBuf=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}try{AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate;noiseBuf=AC.createBuffer(1,n,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
function tone(freq,type,dur,vol,slide){if(!AC)return;try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,lo,hi){if(!AC)return;try{const t=AC.currentTime,s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=(lo+hi)/2;f.Q.value=0.6;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);s.stop(t+dur+0.02);}catch(e){}}

// ---------------- math ----------------
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const sgn=v=>v<0?-1:1;
function lerpAng(a,b,t){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*t;}
const E={lin:t=>t,io:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,out:t=>1-(1-t)*(1-t),in:t=>t*t,out3:t=>1-Math.pow(1-t,3),back:t=>{const c=1.4;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}};
function seeded(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^(s>>>15),1|s);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}

const PART=['hip','sh','head','lh','rh','lf','rf'];
function getP(p){return typeof p==='string'?P[p]:p;}
function clonePose(p){const o={};for(const k of PART)o[k]=[p[k][0],p[k][1]];o.sw=p.sw;return o;}
function mixPose(A,B,t){const o={};for(const k of PART)o[k]=[lerp(A[k][0],B[k][0],t),lerp(A[k][1],B[k][1],t)];o.sw=lerpAng(A.sw,B.sw,t);return o;}
function animPose(keys,t){if(t<=keys[0][0])return clonePose(getP(keys[0][1]));for(let i=0;i<keys.length-1;i++){const k0=keys[i],k1=keys[i+1];if(t<=k1[0]){const u=(t-k0[0])/(k1[0]-k0[0]);return mixPose(getP(k0[1]),getP(k1[1]),(E[k1[2]||'io'])(u));}}return clonePose(getP(keys[keys.length-1][1]));}
function runPose(ph){const a=ph*TAU,s=Math.sin(a),c=Math.cos(a);const lift=v=>Math.max(0,v);return{hip:[0.05,-0.9-0.06*Math.abs(s)],sh:[0.24,-1.65],head:[0.32,-1.89],lf:[-c*0.45,-lift(s)*0.35],rf:[c*0.45,-lift(-s)*0.35],lh:[0.3+c*0.25,-1.15],rh:[0.05-c*0.25,-1.1],sw:-0.5+c*0.2};}

function ik(a,b,len,score){let dx=b[0]-a[0],dy=b[1]-a[1];let d=Math.hypot(dx,dy)||1e-6;const maxd=len*2*0.995;if(d>maxd){const k=maxd/d;dx*=k;dy*=k;b[0]=a[0]+dx;b[1]=a[1]+dy;d=maxd;}const mx=a[0]+dx/2,my=a[1]+dy/2;const h=Math.sqrt(Math.max(0,len*len-d*d/4));const nx=-dy/d,ny=dx/d;const e1=[mx+nx*h,my+ny*h],e2=[mx-nx*h,my-ny*h];return score(e1,mx,my)>=score(e2,mx,my)?e1:e2;}

// ---------------- combat helpers ----------------
function nearestEnemy(x){let best=null,bd=1e9;for(const e of G.enemies){if(!e.alive||e.state==='intro')continue;const d=Math.abs(e.x-x);if(d<bd){bd=d;best=e;}}return best;}
function brokenEnemyNear(p){for(const e of G.enemies)if(e.alive&&e.state==='broken'&&Math.abs(e.x-p.x)<2.6)return e;return null;}
function onPlayerAttackStart(p,a){
 for(const e of G.enemies){
  if(!e.alive||!e.canAct()||e.state==='intro')continue;
  if(Math.abs(e.x-p.x)>p.reach*1.4)continue;
  const r=Math.random();const dc=e.deflectC;const remain=a.active[1]/p.aspd+0.25;
  if(r<dc)e.startGuard(remain,true);
  else if(r<dc+e.blockC)e.startGuard(remain+rnd(0.3),false);
  else if(r<dc+e.blockC+e.evadeC){e.dodge(false);e.think=0.2;}
 }
}
function bladePoints(f){const pts=[];const hand=f.wpts.rh,ang=f.wang,L=f.weapon.len*f.size;for(let i=0;i<=6;i++){const u=i/6;pts.push([hand[0]+Math.cos(ang)*L*u,hand[1]+Math.sin(ang)*L*u]);}return pts;}
function inHurtbox(d,px,py){const hw=0.45*d.size;return Math.abs(px-d.x)<hw&&py<d.y+0.05&&py>d.y-2.2*d.size;}
function resolveAttacks(){
 const all=[G.player,...G.enemies];
 for(const a of all){
  if(!a.alive||a.state!=='attack'||!a.wpts)continue;
  const atk=a.atk;if(a.stateT<atk.active[0]||a.stateT>atk.active[1])continue;
  const pts=bladePoints(a);

function drawHat(f,w,co){const s=f.size,h=w.head,fc=f.facing;const hat=f.def.hat;if(!hat)return;ctx.save();
 switch(hat){
  case'horns':ctx.strokeStyle=co||'#e8d9b0';ctx.lineWidth=0.08*s;ctx.beginPath();ctx.moveTo(h[0]-0.15*s,h[1]-0.15*s);ctx.lineTo(h[0]-0.3*s,h[1]-0.5*s);ctx.moveTo(h[0]+0.15*s,h[1]-0.15*s);ctx.lineTo(h[0]+0.3*s,h[1]-0.5*s);ctx.stroke();break;
  case'wide':ctx.fillStyle=co||'#2a2f3a';ctx.beginPath();ctx.moveTo(h[0]-0.6*s,h[1]-0.15*s);ctx.lineTo(h[0],h[1]-0.5*s);ctx.lineTo(h[0]+0.6*s,h[1]-0.15*s);ctx.closePath();ctx.fill();break;
  case'kasa':ctx.fillStyle=co||'#b89a62';ctx.beginPath();ctx.moveTo(h[0]-0.7*s,h[1]-0.1*s);ctx.lineTo(h[0],h[1]-0.62*s);ctx.lineTo(h[0]+0.7*s,h[1]-0.1*s);ctx.closePath();ctx.fill();break;
  case'mask':ctx.strokeStyle=co||'#1a1a24';ctx.lineWidth=0.1*s;ctx.beginPath();ctx.moveTo(h[0]-0.25*s,h[1]+0.02*s);ctx.lineTo(h[0]+0.25*s,h[1]+0.02*s);ctx.stroke();break;
  case'band':ctx.strokeStyle=co||'#3a2a2a';ctx.lineWidth=0.07*s;ctx.beginPath();ctx.moveTo(h[0]-0.24*s,h[1]-0.08*s);ctx.lineTo(h[0]+0.24*s,h[1]-0.08*s);ctx.stroke();ctx.beginPath();ctx.moveTo(h[0]-fc*0.22*s,h[1]-0.08*s);ctx.lineTo(h[0]-fc*0.5*s,h[1]+0.15*s);ctx.stroke();break;
 }ctx.restore();}
function drawScarf(f,color){const w=f.wpts;if(!w)return;const s=f.size,fc=f.facing,n=w.sh;const drift=-fc*0.5-f.vx*0.08;ctx.save();ctx.strokeStyle=color;ctx.lineCap='round';
 for(let k=0;k<2;k++){ctx.lineWidth=(0.09-k*0.03)*s;ctx.beginPath();ctx.moveTo(n[0],n[1]+0.05*s);let px=n[0],py=n[1]+0.05*s;for(let i=1;i<=4;i++){const u=i/4;const wave=Math.sin(G.t*9+i*1.3+k*2+f.x)*0.09*u;px=n[0]+drift*u*s*(1+k*0.35);py=n[1]+0.05*s+u*0.35*s+wave*s+k*0.12*s*u;ctx.lineTo(px,py);}ctx.stroke();}ctx.restore();}
function drawFighter(f){
 if(!f.wpts)f.computeWorld();const w=f.wpts,s=f.size;
 ctx.save();ctx.globalAlpha=f.alpha;
 // shadow
 ctx.fillStyle='rgba(0,0,0,0.45)';ctx.beginPath();const sh=clamp(1+f.y*0.4,0.3,1);ctx.ellipse(f.x,0.05,0.55*s*sh,0.1*s*sh,0,0,TAU);ctx.fill();
 // perilous ring glow on ground
 if(f.state==='attack'&&f.atk.perilous&&f.stateT<f.atk.active[0]){ctx.fillStyle='rgba(255,40,20,0.18)';ctx.beginPath();ctx.ellipse(f.x,0.05,0.9*s,0.16*s,0,0,TAU);ctx.fill();}
 const col=f.hurtFlash>0?(f.hurtFlash>0.5?'#ffffff':f.color):f.color;
 const scarf=f.def.scarf;if(scarf)drawScarf(f,scarf);
 drawStick(w,f.wang,f,1,f.hurtFlash>0.5?'#fff':null);
 // marks
 const hx=w.head[0],hy=w.head[1];
 if(f.state==='attack'&&f.atk.perilous&&f.stateT<f.atk.active[0]){const u=(G.t*12)%1;const sc=1+Math.sin(G.t*25)*0.08;ctx.save();ctx.translate(hx,hy-0.75*s);ctx.scale(sc,sc);ctx.fillStyle='rgba(200,20,20,0.9)';ctx.beginPath();for(let i=0;i<9;i++){const a=i/9*TAU,r=0.26+(i%2)*0.07;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 0.42px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',0,0.02);ctx.restore();}
 if(f.state==='broken'){const pulse=0.75+Math.sin(G.t*10)*0.25;ctx.fillStyle='rgba(255,40,30,'+(0.3*pulse)+')';ctx.beginPath();ctx.arc(f.x,hy-0.35*s,0.4*pulse,0,TAU);ctx.fill();ctx.fillStyle='#e8142a';ctx.beginPath();ctx.arc(f.x,hy-0.35*s,0.16,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(f.x-0.04,hy-0.4*s,0.04,0,TAU);ctx.fill();}
 // mini bars for non-boss enemies
 if(!f.isPlayer&&!f.def.boss&&f.alive&&f.state!=='intro'){const bw=1.3,by=hy-0.75*s;ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(f.x-bw/2,by,bw,0.1);ctx.fillStyle='#c33a2e';ctx.fillRect(f.x-bw/2,by,bw*clamp(f.hp/f.hpMax,0,1),0.1);const pw=bw*clamp(f.posture/f.postMax,0,1);ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(f.x-bw/2,by-0.1,bw,0.06);ctx.fillStyle=f.posture/f.postMax>0.8?'#ff5a3d':'#f1c36a';ctx.fillRect(f.x-pw/2,by-0.1,pw,0.06);}
 ctx.restore();
}
function drawEffects(){
 for(const a of G.afterimages){const u=a.life/a.max;drawStick(a.w,a.wang,a.f,a.alpha*u,a.f.isPlayer?'#cfd8e8':'#a08a9a');}
 for(const a of G.arcs){const u=a.life/a.max;ctx.save();ctx.globalAlpha=u*0.85;ctx.fillStyle=a.color;ctx.beginPath();const ccw=a.a1<a.a0;ctx.arc(a.x,a.y,a.r,a.a0,a.a1,ccw);ctx.arc(a.x,a.y,a.r-0.42*(0.5+u*0.5),a.a1,a.a0,!ccw);ctx.closePath();ctx.fill();ctx.restore();}
 for(const p of G.particles){const u=clamp(p.life/p.max,0,1);ctx.globalAlpha=u;if(p.type==='burst'){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,p.size*(1-u)+0.1,0,TAU);ctx.fill();}else if(p.type==='spark'){ctx.strokeStyle=p.color;ctx.lineWidth=p.size;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);ctx.stroke();}else{ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.5+u*0.5),0,TAU);ctx.fill();}}
 ctx.globalAlpha=1;
 for(const p of G.ambient){const u=clamp(p.life,0,1);if(p.fog){ctx.fillStyle=p.color;ctx.globalAlpha=u;ctx.beginPath();ctx.ellipse(p.x,p.y,p.size,p.size*0.35,0,0,TAU);ctx.fill();}else if(p.leaf){ctx.fillStyle=p.color;ctx.globalAlpha=0.85*u;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.wob);ctx.fillRect(-p.size,-p.size*0.4,p.size*2,p.size*0.8);ctx.restore();}else{ctx.fillStyle=p.color;ctx.globalAlpha=0.9*u;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}}
 ctx.globalAlpha=1;
 for(const p of G.pops){const u=p.life/p.max;ctx.save();ctx.globalAlpha=Math.min(1,u*1.5);ctx.fillStyle=p.color;ctx.font='italic 0.34px Georgia';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.text,p.x,p.y-(1-u)*0.3);ctx.restore();}
}
function bar(x,y,w,h,frac,bg,fg){ctx.fillStyle=bg;ctx.fillRect(x,y,w,h);ctx.fillStyle=fg;ctx.fillRect(x,y,w*clamp(frac,0,1),h);ctx.strokeStyle='rgba(235,225,205,0.4)';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);}
function postureBar(cx,y,w,h,frac,shaking){ctx.fillStyle='rgba(20,18,16,0.85)';ctx.fillRect(cx-w/2,y,w,h);const c=frac<0.6?'#f1d58a':frac<0.9?'#f39a4a':'#ff4a2d';ctx.fillStyle=c;const fw=w*clamp(frac,0,1);const jx=shaking?(Math.random()-0.5)*4:0;ctx.fillRect(cx-fw/2+jx,y,fw,h);ctx.strokeStyle='rgba(240,230,210,0.45)';ctx.strokeRect(cx-w/2+0.5,y+0.5,w-1,h-1);ctx.fillStyle='rgba(240,230,210,0.7)';ctx.fillRect(cx-1,y-3,2,h+6);}
function drawHUD(){
 const p=G.player;const m=MISSIONS[G.mission];
 // player hp
 const hx=36,hy=34,hw=Math.min(320,W*0.32);
 ctx.fillStyle='#1b1a1c';ctx.beginPath();ctx.arc(hx,hy+6,13,0,TAU);ctx.fill();ctx.strokeStyle='#d8c9a3';ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy+6,13,0,TAU);ctx.stroke();ctx.fillStyle='#c1272d';ctx.beginPath();ctx.arc(hx,hy+6,5,0,TAU);ctx.fill();
 bar(hx+20,hy,hw,12,p.hp/p.hpMax,'rgba(20,18,16,0.85)',p.hp/p.hpMax<0.3?'#ff5a3d':'#d9452f');
 ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(hx+20,hy,hw*clamp(p.hp/p.hpMax,0,1),4);
 txt('VITALITY',hx+20,hy+22,10,'rgba(235,225,205,0.6)','left','400',1,2);
 // gourds
 for(let i=0;i<3;i++){ctx.fillStyle=i<p.gourds?'#9fe3a0':'rgba(80,80,80,0.5)';ctx.beginPath();ctx.arc(hx+26+i*18,hy+42,6,0,TAU);ctx.fill();ctx.strokeStyle='rgba(235,225,205,0.4)';ctx.lineWidth=1;ctx.stroke();}
 txt('H  heal',hx+84,hy+42,11,'rgba(235,225,205,0.6)','left');
 // player posture bottom
 postureBar(W/2,H-44,Math.min(380,W*0.4),9,p.posture/p.postMax,p.state==='stagger');
 txt('POSTURE',W/2,H-26,10,'rgba(235,225,205,0.55)','center','400',1,3);
 // boss
 const b=G.boss;
 if(b&&b.alive&&(G.state==='fight'||G.state==='bossIntro')&&b.state!=='intro'){
  const bw=Math.min(520,W*0.55);postureBar(W/2,52,Math.min(400,W*0.42),9,b.posture/b.postMax,false);
  bar(W/2-bw/2,70,bw,10,b.hp/b.hpMax,'rgba(20,18,16,0.85)','#c33a2e');
  txt(b.name.toUpperCase(),W/2,94,13,'#efe6d2','center','400',1,3);
  for(let i=0;i<b.nodes;i++){ctx.fillStyle='#e8142a';ctx.beginPath();ctx.arc(W/2-bw/2-14-i*16,75,5,0,TAU);ctx.fill();}
 }
 // mission label
 if(G.state!=='title'){txt('MISSION '+m.num+'  ·  '+m.title.toUpperCase(),W-(touchEnabled()?70:30),30,11,'rgba(235,225,205,0.6)','right','400',1,2);
  const left=G.enemies.filter(e=>e.alive).length;const wv=G.bossSpawned?'BOSS':'WAVE '+Math.min(G.wave,m.waves.length)+' / '+m.waves.length;txt(wv+(left?'   —   '+left+' left':''),W-(touchEnabled()?70:30),48,11,'rgba(235,225,205,0.45)','right','400',1,2);}
 if(G.mission===0&&G.missionT<45&&G.state==='fight'&&!touchEnabled()){txt((padConnected?'[GAMEPAD]  D-pad move  X attack  L1 deflect  B dodge  A jump  Y heal       ':'')+'A / D  move     J  attack     K  deflect (tap) / guard (hold)     L  dodge  (toward a red thrust = counter)     SPACE  jump (over red sweeps)     H  heal',W/2,H-10,11,'rgba(235,225,205,0.5)','center');}
 if(G.state==='death')txt('press R to try again',W/2,H-62,13,'rgba(235,225,205,0.8)','center');
}
function dim(a){ctx.fillStyle='rgba(5,4,6,'+a+')';ctx.fillRect(0,0,W,H);}
function drawCards(){
 const m=MISSIONS[G.mission];
 if(G.state==='title'){
  dim(0.35);const pulse=0.6+Math.sin(G.t*2.5)*0.25;
  brushBand(W/2-Math.min(360,W*0.42),H*0.3-50,Math.min(720,W*0.84),100,'#15090c',0.85,9);
  txt('PAPER BLADE',W/2,H*0.3,Math.min(92,W*0.1),'#efe6d2','center','400',1,10);
  txt('a deflect duel in five missions',W/2,H*0.3+68,18,'rgba(235,225,205,0.75)','center','400',1,3);
  const lines=['A / D  —  move','J  —  attack (3-hit combo)','K  —  tap to DEFLECT, hold to guard','L  —  dodge  ·  toward a red THRUST to counter it','SPACE  —  jump  ·  over a red SWEEP to counter it','H  —  heal (3 per mission)','Fill their POSTURE, then strike the red dot for a DEATHBLOW'];
  lines.forEach((l,i)=>txt(l,W/2,H*0.56+i*24,15,i===6?'#f3c88a':'rgba(235,225,205,0.8)','center'));
  txt(touchEnabled()?'tap to begin':'press ENTER'+(padConnected?'  or  START':''),W/2,H*0.56+7*24+20,16,'rgba(235,225,205,'+pulse+')','center','400',1,4);txt('O  /  Select  /  tap here  \u2014  OPTIONS & button mapping',W/2,H*0.56+7*24+52,13,'rgba(243,200,138,0.85)','center','400',1,2);
 }
 if(G.state==='intro'){
  const u=clamp(G.cardT/0.8,0,1),fade=E.out(u);dim(0.6*fade);
  brushBand(W/2-Math.min(380,W*0.44),H*0.42-56,Math.min(760,W*0.88),112,'#120a0d',0.9*fade,13+G.mission);
  txt('MISSION '+m.num,W/2,H*0.42-68,16,'rgba(235,225,205,'+(0.7*fade)+')','center','400',1,6);
  txt(m.title.toUpperCase(),W/2,H*0.42,Math.min(60,W*0.065),'#efe6d2','center','400',fade,8);
  txt(m.sub,W/2,H*0.42+70,17,'rgba(235,225,205,'+(0.85*fade)+')','center');
  if(G.cardT>1.2)txt('press any key',W/2,H*0.42+120,13,'rgba(235,225,205,'+(0.4+0.3*Math.sin(G.t*3))+')','center','400',1,3);
 }
 if(G.state==='bossIntro'&&G.introT>0.9){
  const u=clamp((G.introT-0.9)/0.5,0,1);const b=G.boss;
  brushBand(W/2-Math.min(360,W*0.42),H*0.78-28,Math.min(720,W*0.84),56,'#4a0a10',0.9*u,31);
  txt(b.name.toUpperCase(),W/2,H*0.78,Math.min(30,W*0.035),'#f3e9d6','center','400',u,5);
 }
 if(G.state==='death'){
  const u=clamp(G.cardT/1.0,0,1);dim(0.55*u);
  brushBand(W/2-Math.min(300,W*0.36),H*0.42-70,Math.min(600,W*0.72),140,'#2a0609',0.9*u,41);
  txt('FALLEN',W/2,H*0.42,Math.min(110,W*0.12),'#c8102e','center','400',u,14);
 }
 if(G.state==='clear'){
  const u=clamp(G.cardT/0.8,0,1);dim(0.5*u);
  brushBand(W/2-Math.min(340,W*0.4),H*0.4-50,Math.min(680,W*0.8),100,'#0d0f12',0.9*u,51);
  txt('MISSION '+m.num+' COMPLETE',W/2,H*0.4,Math.min(48,W*0.055),'#efe6d2','center','400',u,8);
  txt(m.title,W/2,H*0.4+64,20,'rgba(235,225,205,0.8)','center','400',u);
  txt('deflects '+G.stats.deflects+'   ·   deathblows '+G.stats.deathblows+'   ·   counters '+G.stats.mikiri+'   ·   deaths '+G.stats.deaths,W/2,H*0.4+100,14,'rgba(235,225,205,0.6)','center','400',u,2);
  if(G.cardT>1.4)txt(G.mission<MISSIONS.length-1?'press any key for the next mission':'press any key',W/2,H*0.4+140,13,'rgba(235,225,205,'+(0.4+0.3*Math.sin(G.t*3))+')','center','400',1,3);
 }
 if(G.state==='ending'){
  const u=clamp(G.cardT/1.5,0,1);dim(0.6*u);
  brushBand(W/2-Math.min(380,W*0.44),H*0.38-60,Math.min(760,W*0.88),120,'#0d0a12',0.9*u,61);
  txt('THE ROOF IS QUIET',W/2,H*0.38,Math.min(60,W*0.065),'#efe6d2','center','400',u,10);
  txt('Five missions. One blade. The paper did not tear.',W/2,H*0.38+74,18,'rgba(235,225,205,0.8)','center','400',u);
  txt('deflects '+G.stats.deflects+'   ·   deathblows '+G.stats.deathblows+'   ·   counters '+G.stats.mikiri+'   ·   deaths '+G.stats.deaths,W/2,H*0.38+110,15,'rgba(235,225,205,0.65)','center','400',u,2);
  if(G.cardT>1.5)txt('press any key to return to the title',W/2,H*0.38+150,13,'rgba(235,225,205,'+(0.4+0.3*Math.sin(G.t*3))+')','center','400',1,3);
 }
 if(G.paused){dim(0.5);txt('PAUSED',W/2,H/2-10,48,'#efe6d2','center','400',1,10);txt('Enter / A  resume          P / Start  unpause',W/2,H/2+28,14,'rgba(235,225,205,0.7)','center');brushBand(W/2-90,H*0.5+22,180,44,'#15090c',0.85,83);txt('OPTIONS  (O / Select)',W/2,H*0.5+45,15,'#f3c88a','center','400',1,3);}
 // deathblow glyph
 if(G.glyph>0){const u=G.glyph/1.5;const punch=1+Math.max(0,(G.glyph-1.3))*2.5;const a=Math.min(1,u*2.5);ctx.save();ctx.translate(W/2,H*0.3);ctx.scale(punch,punch);brushBand(-150,-70,300,140,'#8a0b1c',0.85*a,71);ctx.restore();txt('斬',W/2,H*0.3+6,Math.min(150,W*0.16)*punch,'rgba(250,240,230,'+a+')','center','400');txt('DEATHBLOW',W/2,H*0.3+110,16,'rgba(250,230,220,'+a+')','center','400',1,8);}
 // flash
 if(G.flash.a>0.005){ctx.fillStyle=G.flash.color;ctx.globalAlpha=G.flash.a;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
 // vignette
 const vg=ctx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function render(){
 ctx.setTransform(DPR,0,0,DPR,0,0);
 renderBackground();
 ctx.save();worldTransform();
 drawGround();
 const dead=G.enemies.filter(e=>!e.alive),live=G.enemies.filter(e=>e.alive);
 for(const f of dead)drawFighter(f);
 for(const a of G.afterimages){const u=a.life/a.max;drawStick(a.w,a.wang,a.f,a.alpha*u,a.f.isPlayer?'#cfd8e8':'#a08a9a');}
 for(const f of live)drawFighter(f);
 drawFighter(G.player);
 // effects (without afterimages again)
 const saveAI=G.afterimages;G.afterimages=[];drawEffects();G.afterimages=saveAI;
 ctx.restore();
 if(G.state!=='title'&&G.state!=='ending'&&G.state!=='settings')drawHUD();
 drawCards();
 if(G.state==='settings')drawSettings();else if(G.state==='fight'||G.state==='bossIntro')drawTouch();
}

// ---------------- loop ----------------
resetTitle();
let last=performance.now();
function frame(now){const dtR=Math.min(0.05,(now-last)/1000);last=now;try{update(dtR);render();}catch(e){console.error(e);}clickPt=null;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
